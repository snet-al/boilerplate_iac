# =============================================================================
# NGINX DEVELOPMENT CONFIGURATION
# =============================================================================

# Laravel Backend (PHP-FPM)
server {
    listen 80;
    server_name api.localhost laravel.localhost;

    location / {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Laravel entry point
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Forwarded headers
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
    }
}

# NestJS Backend
server {
    listen 80;
    server_name nestjs.localhost;

    location / {
        proxy_pass http://nestjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # WebSocket support
    location /socket.io/ {
        proxy_pass http://nestjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# React Frontend
server {
    listen 80;
    server_name react.localhost;

    location / {
        proxy_pass http://react:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Next.js Frontend
server {
    listen 80;
    server_name next.localhost localhost;

    location / {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js HMR WebSocket
    location /_next/webpack-hmr {
        proxy_pass http://next:3000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Combined API Gateway (Development)
server {
    listen 80 default_server;
    server_name _;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Laravel API routes (PHP-FPM)
    location /api/laravel/ {
        rewrite ^/api/laravel/(.*)$ /$1 break;

        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Laravel entry point
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Forwarded headers
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        fastcgi_read_timeout 60s;
    }

    # NestJS API routes
    location /api/nestjs/ {
        rewrite ^/api/nestjs/(.*)$ /$1 break;
        proxy_pass http://nestjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default to Next.js
    location / {
        proxy_pass http://next:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
