# =============================================================================
# DOCKER COMPOSE - PRODUCTION ENVIRONMENT
# =============================================================================
# Production-optimized services with security, resource limits, and logging
# Usage: docker-compose -f docker-compose.prod.yaml up -d
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # DATABASES
  # ===========================================================================

  mongo:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_mongo
    restart: always
    env_file:
      - ${ENV_DIR:-.}/.env.db.mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-app_db}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_redis
    restart: always
    env_file:
      - ${ENV_DIR:-.}/.env.db.redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  mysql:
    image: mysql:8
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_mysql
    restart: always
    env_file:
      - ${ENV_DIR:-.}/.env.db.mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=1G
      --max-connections=500
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_postgres
    restart: always
    env_file:
      - ${ENV_DIR:-.}/.env.db.postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app_user}']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

  # ===========================================================================
  # BACKENDS
  # ===========================================================================

  laravel:
    build:
      context: ./apps/laravel
      dockerfile: ../../docker/laravel/Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_laravel
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      LOG_LEVEL: error
    volumes:
      - laravel_storage:/var/www/html/storage
    networks:
      - backend_network
      - frontend_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  nestjs:
    build:
      context: ./apps/nestjs
      dockerfile: ../../docker/nestjs/Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_nestjs
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # ===========================================================================
  # FRONTENDS
  # ===========================================================================

  react:
    build:
      context: ./apps/react
      dockerfile: ../../docker/react/Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_react
    restart: always
    networks:
      - frontend_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  next:
    build:
      context: ./apps/next
      dockerfile: ../../docker/next/Dockerfile.prod
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_next
    restart: always
    networks:
      - frontend_network
    depends_on:
      - nestjs
      - laravel
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'

  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-prod}_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx/prod:/etc/nginx/conf.d:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend_network
      - backend_network
    depends_on:
      - laravel
      - nestjs
      - react
      - next
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  laravel_storage:
    driver: local
  nginx_cache:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  backend_network:
    driver: bridge
    internal: true
  frontend_network:
    driver: bridge
