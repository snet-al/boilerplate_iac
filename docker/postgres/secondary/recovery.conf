# PostgreSQL Secondary (Standby) Recovery Configuration
# Note: In PostgreSQL 12+, use standby.signal instead of recovery.conf

# Connection to primary
primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=REPLICATION_PASSWORD application_name=secondary'

# Replication slot (optional but recommended)
primary_slot_name = 'secondary_slot'

# Recovery target
recovery_target_timeline = 'latest'

# Trigger file to promote to primary
promote_trigger_file = '/tmp/postgresql.trigger'
