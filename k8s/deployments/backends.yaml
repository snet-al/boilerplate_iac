# =============================================================================
# BACKEND DEPLOYMENTS
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: app
  labels:
    app: laravel
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: laravel
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: laravel
        tier: backend
    spec:
      containers:
        - name: laravel
          image: laravel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secrets
          env:
            - name: DB_HOST
              value: mysql-primary
            - name: REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: laravel-storage-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs
  namespace: app
  labels:
    app: nestjs
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nestjs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nestjs
        tier: backend
    spec:
      containers:
        - name: nestjs
          image: nestjs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: nestjs-config
            - secretRef:
                name: nestjs-secrets
          env:
            - name: DATABASE_HOST
              value: postgres-primary
            - name: REDIS_HOST
              value: redis
            - name: MONGO_HOST
              value: mongo-primary
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
